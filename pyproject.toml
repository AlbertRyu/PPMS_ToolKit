[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "PPMS_Toolkit"
version = "0.2.0"
description = "Toolkit for PPMS data processing"
authors = [{name="Yunxiao LIU", email="yunxiao.liu@tum.de"}]
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "readme.md"

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
gui = [
    "PySide6",
    "pyarrow>=10.0.0",  
]

[project.scripts]                
ppms-toolkit = "ppms_toolkit_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]