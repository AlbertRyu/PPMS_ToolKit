[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "PPMS_Toolkit"
version = "0.2.2"
description = "Toolkit for PPMS data processing"
authors = [{name="Yunxiao LIU", email="yunxiao.liu@tum.de"}]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
readme = "readme.md"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/AlbertRyu/PPMS_ToolKit"
Issues = "https://github.com/AlbertRyu/PPMS_ToolKit/issues"



[project.optional-dependencies]
gui = [
    "PySide6",
    "pyarrow>=10.0.0",  
]

[project.scripts]                
ppms-toolkit = "ppms_toolkit_gui.app:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/infrastructure",
    "src/ppms_toolkit",
    "src/ppms_toolkit_gui",
]