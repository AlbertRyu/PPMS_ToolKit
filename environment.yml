name: ppms_toolkit
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9
  - pip
  # 科学计算核心库
  - numpy>=1.21
  - scipy>=1.7
  - pandas>=1.3
  - matplotlib>=3.4
  # GUI 相关
  - pyarrow>=10.0  # parquet 文件读写
  # 开发工具（可选）
  - ipykernel  # Jupyter 支持
  - pip:
      - PySide6>=6.4  # Qt6 GUI 框架（conda-forge 的版本可能有问题，用 pip 安装更稳定）
